{% import 'ezderm/macros/email-macros.html' as email_macros %}

{% set variant = module.variant %}
{% set size = module.size %}

{% if variant == 'vertical' %}
    <table role="presentation" class="table spacer" width="100%" cellpadding="0" cellspacing="0">
        {{ email_macros.vspace(size) }}
    </table>
{% else %}
    {{ email_macros.hspace(size) }}
{% endif %}
